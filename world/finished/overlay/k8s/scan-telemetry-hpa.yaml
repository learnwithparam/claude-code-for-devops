apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scan-telemetry
  namespace: scan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scan-telemetry
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
