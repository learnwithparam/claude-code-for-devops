# Plan review for tallowmark-infra, on every pull request that changes a saved plan.
# In a real repo this file lives in the GitHub workflows folder. The practice repo keeps it in
# workflows/ so it never runs on GitHub.
name: plan-review
on:
  pull_request:
    paths:
      - "plans/**"
      - "terraform/**"
# The job reads the code and writes one comment. It holds no cloud key of any kind.
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install Claude Code, pinned
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Review each saved plan with the command in review.config.json
        env:
          # The pull request text goes in as data through an env variable, never pasted into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The course runner replays when CI is set. Empty means: run Claude Code for real.
          CI: ""
        run: |
          mkdir -p reviews
          review_command=$(jq -r .command review.config.json)
          for plan in plans/*.json; do
            sh -c "$review_command \"$plan\"" > "reviews/$(basename "$plan")"
          done
      - name: Post the verdicts as one comment
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read every file in reviews/. Each one is the JSON verdict for one saved plan.
            Post one comment on this pull request with a table: plan, verdict, destroys,
            replaces, and the first reason. Change no file. Run nothing else.
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 5
            --allowedTools Read,Bash(gh pr comment *)
      - name: Fail the job when any plan is blocked
        run: |
          for review in reviews/*.json; do
            jq -e '.verdict != "block"' "$review" > /dev/null || exit 1
          done
