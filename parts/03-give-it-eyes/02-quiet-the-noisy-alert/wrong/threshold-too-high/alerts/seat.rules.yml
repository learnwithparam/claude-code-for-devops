groups:
  - name: seat-api
    rules:
      - alert: SeatApiSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(seat_api_request_seconds_bucket[5m]))) > 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Seat API p99 latency over 3s for 5 minutes
