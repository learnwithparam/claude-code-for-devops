# The identity Claude Code reads the clusters as. Apply the same file to dev and to prod.
# read_only = true in the MCP settings keeps it safe, so the role can be broad.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-reader
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-reader
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources: ["pods", "pods/log", "services", "events", "namespaces", "nodes", "deployments", "horizontalpodautoscalers"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-reader
subjects:
  - kind: ServiceAccount
    name: claude-reader
    namespace: ops
