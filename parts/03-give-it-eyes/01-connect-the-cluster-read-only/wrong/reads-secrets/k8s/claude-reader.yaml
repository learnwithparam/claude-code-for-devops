# The identity Claude Code reads the clusters as. Apply the same file to dev and to prod.
# It can look at everything in the cluster, but change nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-reader
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-reader
subjects:
  - kind: ServiceAccount
    name: claude-reader
    namespace: ops
