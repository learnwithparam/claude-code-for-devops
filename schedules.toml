# Parts mapped onto formats. Step minutes never change; only the wrapping does.
# The closing part check-infrastructure-rules-with-conftest is 20 minutes.
# Part minutes: orientation 15, fence-the-agent 90, teach-the-repo 95, give-it-eyes 100, run-it-in-ci 95, ship-the-kit 90, work-in-parallel 55.

[one-day]
sessions = [
  { parts = ["orientation", "fence-the-agent"], minutes = 120 },
  { parts = ["teach-the-repo"], minutes = 105 },
  { parts = ["give-it-eyes"], minutes = 110 },
  { parts = ["run-it-in-ci"], minutes = 105 },
  { parts = ["ship-the-kit"], minutes = 100 },
  { parts = ["work-in-parallel"], minutes = 65 },
  { parts = ["check-infrastructure-rules-with-conftest"], minutes = 30 },
]

[four-evenings]
sessions = [
  { parts = ["orientation", "fence-the-agent"], minutes = 120 },
  { parts = ["teach-the-repo"], minutes = 105 },
  { parts = ["give-it-eyes"], minutes = 110 },
  { parts = ["run-it-in-ci"], minutes = 105 },
  { parts = ["ship-the-kit"], minutes = 100 },
  { parts = ["work-in-parallel"], minutes = 65 },
  { parts = ["check-infrastructure-rules-with-conftest"], minutes = 30 },
]

# A cohort: one part per session, a 30 minute live kickoff and a 30 minute live review around each.
[four-week-cohort]
sessions = [
  { parts = ["orientation", "fence-the-agent"], minutes = 165 },
  { parts = ["teach-the-repo"], minutes = 150 },
  { parts = ["give-it-eyes"], minutes = 155 },
  { parts = ["run-it-in-ci"], minutes = 155 },
  { parts = ["ship-the-kit"], minutes = 150 },
  { parts = ["work-in-parallel"], minutes = 115 },
  { parts = ["check-infrastructure-rules-with-conftest"], minutes = 30 },
]
