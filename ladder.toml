# The Claude Code ladder, L0 to L6, mapped to this course.
# Each feature names the step that uses it and a words-from-a-rule that its check must still hold.
# checks/ladder.ts fails when a feature has no step, a step has no check, or the rule is gone.

[[feature]]
level = "L0"
name = "plan mode"
step = "choose-the-permission-mode"
rule = "filled row for each of the five modes"

[[feature]]
level = "L0"
name = "@ files"
step = "meet-the-world"
rule = "How I asked"

[[feature]]
level = "L0"
name = "screenshots"
step = "meet-the-world"
rule = "How I asked"

[[feature]]
level = "L0"
name = "a specific prompt"
step = "meet-the-world"
rule = "named one of the five faults"

[[feature]]
level = "L1"
name = "permission modes"
step = "choose-the-permission-mode"
rule = "permissions.defaultMode is set"

[[feature]]
level = "L1"
name = "diff review"
step = "choose-the-permission-mode"
rule = "When it goes wrong"

[[feature]]
level = "L1"
name = "Esc"
step = "choose-the-permission-mode"
rule = "When it goes wrong"

[[feature]]
level = "L1"
name = "/rewind"
step = "choose-the-permission-mode"
rule = "When it goes wrong"

[[feature]]
level = "L1"
name = "/clear"
step = "choose-the-permission-mode"
rule = "When it goes wrong"

[[feature]]
level = "L2"
name = "/init"
step = "write-the-repo-memory"
rule = "CLAUDE.md exists"

[[feature]]
level = "L2"
name = "CLAUDE.md under 200 lines"
step = "write-the-repo-memory"
rule = "CLAUDE.md exists"

[[feature]]
level = "L2"
name = ".claude/rules"
step = "write-the-repo-memory"
rule = "terraform.md has paths"

[[feature]]
level = "L2"
name = "a check to run"
step = "write-the-repo-memory"
rule = "Done means names"

[[feature]]
level = "L3"
name = "hooks"
step = "catch-the-sneaky-commands"
rule = "the hook blocks all 10 bypass forms"

[[feature]]
level = "L3"
name = "deny rules"
step = "write-the-deny-rules"
rule = "a deny rule stops reading .env"

[[feature]]
level = "L3"
name = "sandbox"
step = "sandbox-the-shell"
rule = "the sandbox is on"

[[feature]]
level = "L3"
name = "skills"
step = "write-a-runbook-skill"
rule = "has a name and a description"

[[feature]]
level = "L3"
name = "MCP or CLI tools"
step = "connect-the-cluster-read-only"
rule = "kubernetes-mcp-server"

[[feature]]
level = "L4"
name = "interview to SPEC.md"
step = "gate-the-goal-with-a-stop-hook"
rule = "SPEC.md has Goal"

[[feature]]
level = "L4"
name = "/goal"
step = "gate-the-goal-with-a-stop-hook"
rule = "goal.txt has a /goal line"

[[feature]]
level = "L4"
name = "Stop hook gate"
step = "gate-the-goal-with-a-stop-hook"
rule = "the Stop hook blocks when the check fails"

[[feature]]
level = "L4"
name = "/code-review in a subagent"
step = "gate-the-goal-with-a-stop-hook"
rule = "the reviewer subagent cannot Edit or Write"

[[feature]]
level = "L5"
name = "subagents"
step = "split-the-cost-hunt"
rule = "three or more subagents"

[[feature]]
level = "L5"
name = "worktrees"
step = "run-agents-apart"
rule = "each in its own worktree"

[[feature]]
level = "L5"
name = "/batch"
step = "run-agents-apart"
rule = "batch.md has a /batch line"

[[feature]]
level = "L5"
name = "a reviewer agent"
step = "run-agents-apart"
rule = "the reviewer subagent cannot Edit or Write"

[[feature]]
level = "L6"
name = "claude -p"
step = "review-the-plan-headless"
rule = "on every plan it prints one JSON object"

[[feature]]
level = "L6"
name = "/loop"
step = "triage-the-live-incident"
rule = "Watch it runs a read-only /loop"

[[feature]]
level = "L6"
name = "/schedule"
step = "schedule-the-drift-check"
rule = "the schedule runs at most once an hour"

[[feature]]
level = "L6"
name = "a GitHub Action"
step = "wire-the-plan-review"
rule = "every action is pinned"

[[feature]]
level = "L6"
name = "a run contract"
step = "schedule-the-drift-check"
rule = "the run contract caps turns"

[[feature]]
level = "L6"
name = "metrics"
step = "export-the-telemetry"
rule = "metrics and logs go out over OTLP"

